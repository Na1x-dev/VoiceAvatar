
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <!-- Белое тело персонажа -->
  <path d="M 75 580 
           C 70 480, 80 340, 150 240 
           C 200 170, 310 180, 420 215 
           C 450 225, 460 250, 440 280 
           C 420 310, 400 390, 400 580 
           Z" fill="#ffffff" />

  <!-- Внешний черный контур тела -->
  <path d="M 75 580 
           C 70 480, 80 340, 150 240 
           C 200 170, 310 180, 420 215 
           C 450 225, 460 250, 440 280 
           C 420 310, 400 390, 400 580" 
        fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Рот (прямая линия сомкнутых губ) -->
  <path d="M 195 285 L 345 272" fill="none" stroke="#000000" stroke-width="11" stroke-linecap="round" />

  <!-- Левый глаз -->
  <circle cx="215" cy="225" r="10" fill="#000000" />

  <!-- Правый глаз (чуть смещен вправо и выше по форме головы) -->
  <circle cx="395" cy="220" r="10" fill="#000000" />

  <!-- Руки, скрещенные на груди -->
  <!-- Правая рука (идет снизу налево и сгибается к центру) -->
  <path d="M 103 400 L 160 480 L 255 455" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Левая рука (идет справа налево, перекрывая правую, и сгибается в кулак) -->
  <path d="M 395 440 L 220 485 L 180 445" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Прорисовка объема локтей и подмышек -->
  <path d="M 396 465 L 380 455" fill="none" stroke="#000000" stroke-width="11" stroke-linecap="round" />
</svg>
